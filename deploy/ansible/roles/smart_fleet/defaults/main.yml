---
# Directory on the server where the application is installed
smart_fleet_app_dir: /opt/smart-fleet

# Repository root the files are copied from (two levels above site.yml)
smart_fleet_repo_root: "{{ playbook_dir }}/../.."

# Image tag to deploy — required, must be immutable (e.g. sha-1a2b3c4)
# smart_fleet_image_tag:

# Grafana admin password — required, pass it on the command line or via Ansible Vault
# smart_fleet_grafana_admin_password:

smart_fleet_alert_temp_threshold: 80
smart_fleet_log_level: INFO

# Docker daemon address (Linux default; may differ on Docker Desktop)
smart_fleet_docker_host: unix:///var/run/docker.sock

# Pull an image only if it is missing. Tags are immutable, so "missing" is enough and idempotent.
smart_fleet_pull_policy: missing

# Waiting for /health: 30 attempts x 2 s
smart_fleet_health_retries: 30
smart_fleet_health_delay: 2
