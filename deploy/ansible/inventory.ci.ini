# CI için: playbook'u çalıştığı makinenin kendisine (localhost) uygular
[fleet]
localhost ansible_connection=local

[fleet:vars]
ansible_python_interpreter=auto_silent
# CI'da GHCR'dan çekilmez; bu commit'in kodundan build edilen ":ci" imajları kullanılır
smart_fleet_image_tag=ci
smart_fleet_pull_policy=never
