# Serves the React app and forwards API calls, so the browser only talks to one origin
# (no CORS, and the API and agent do not have to be reachable from the browser).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS. With a variable in proxy_pass, nginx resolves the name per request,
    # so a restarted api or agent container (new IP) is found again, and nginx can
    # start even if a service is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/vehicles -> http://api:8000/vehicles (the prefix is removed)
    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /agent/reports -> http://agent:8100/reports
    location /agent/ {
        set $agent_upstream http://agent:8100;
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass $agent_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in these file names, so they can be cached for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (/vehicles/3, /incidents/5) get index.html and
    # React Router renders the page. index.html itself is never cached, so a new
    # deployment is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
