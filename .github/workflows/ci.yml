name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Aynı branch'e yeni commit gelince eski çalışmayı iptal et
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ilsuyuksel133/smart-fleet

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest --cov=api --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, dashboard, simulator]
    env:
      # Sadece main'e push'ta imajları GHCR'a gönder, PR'larda sadece build et
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ env.SHORT_SHA }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  smoke-test:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create .env
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d --build

      - name: Run smoke test
        run: ./scripts/smoke_test.sh http://localhost:8000

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  ansible-deploy-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      ANSIBLE_NOCOLOR: "1"
    defaults:
      run:
        working-directory: deploy/ansible
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deploy/ansible/requirements.txt

      - name: Install Ansible
        run: pip install -r requirements.txt

      - name: Lint playbook
        run: ansible-lint

      - name: Generate a throwaway Grafana password
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "GRAFANA_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build images for this commit
        working-directory: .
        run: |
          for service in api dashboard simulator; do
            docker build -t "ghcr.io/ilsuyuksel133/smart-fleet-${service}:ci" -f "${service}/Dockerfile" .
          done

      - name: Run playbook (first run)
        run: >-
          ansible-playbook -i inventory.ci.ini site.yml
          -e "smart_fleet_grafana_admin_password=$GRAFANA_PASSWORD"

      - name: Run smoke test
        working-directory: .
        run: ./scripts/smoke_test.sh http://localhost:8000

      - name: Run playbook again and check idempotency (changed=0)
        run: |
          ansible-playbook -i inventory.ci.ini site.yml \
            -e "smart_fleet_grafana_admin_password=$GRAFANA_PASSWORD" | tee second-run.log
          grep -qE "localhost +: ok=[0-9]+ +changed=0 +unreachable=0 +failed=0" second-run.log

      - name: Show logs on failure
        if: failure()
        working-directory: /tmp
        run: docker compose -p smart-fleet logs

      - name: Tear down
        if: always()
        working-directory: /tmp
        run: docker compose -p smart-fleet down -v
