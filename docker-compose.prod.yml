# Production override: use the prebuilt GHCR images instead of building from source.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# IMAGE_TAG must be an immutable tag (e.g. sha-1a2b3c4), not "latest".
services:
  api:
    build: !reset null
    image: ghcr.io/ilsuyuksel133/smart-fleet-api:${IMAGE_TAG:?set IMAGE_TAG in .env}

  dashboard:
    build: !reset null
    image: ghcr.io/ilsuyuksel133/smart-fleet-dashboard:${IMAGE_TAG:?set IMAGE_TAG in .env}

  simulator:
    build: !reset null
    image: ghcr.io/ilsuyuksel133/smart-fleet-simulator:${IMAGE_TAG:?set IMAGE_TAG in .env}

  agent:
    build: !reset null
    image: ghcr.io/ilsuyuksel133/smart-fleet-agent:${IMAGE_TAG:?set IMAGE_TAG in .env}
